services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamtodo
      POSTGRES_PASSWORD: teamtodo
      POSTGRES_DB: teamtodo
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgres://teamtodo:teamtodo@db:5432/teamtodo
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - db

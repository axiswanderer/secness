name: Sandbox escape and egress

# Plan, cross-cutting: run on every change to packages/sandbox (and the worker image from Stage 4).
on:
  push:
    branches: [main]
    paths: ["packages/sandbox/**", "packages/schema/**", ".github/workflows/sandbox.yml"]
  pull_request:
    paths: ["packages/sandbox/**", "packages/schema/**", ".github/workflows/sandbox.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  escape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A missing Docker daemon must fail this job, never skip it.
      SECNESS_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @secness/sandbox... build
      - run: pnpm test:sandbox-escape
